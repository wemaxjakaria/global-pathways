name: Deploy Globla Pathways App to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # or your version

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci -f

      # 4️⃣ Build Globla Pathways app
      - name: Build Globla Pathways
        run: npm run build

      # 5️⃣ Compress build files
      - name: Archive build files
        run: tar -czf global-pathways-build.tar.gz out

      # 6️⃣ Copy files to VPS
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "global-pathways-build.tar.gz"
          target: "/var/www/global-pathways/"

      # 7️⃣ Connect to VPS and deploy
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/var/www/global-pathways
            tar -xzf global-pathways-build.tar.gz
            rm global-pathways-build.tar.gz
            rm -f global-pathways-build.tar.gz
            sudo systemctl restart nginx.service
